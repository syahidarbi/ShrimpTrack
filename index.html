<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ShrimpTrack</title>

  <!-- Tag Logo / Favicon Browser -->
  <link rel="icon" type="image/png" href="/logo.png">

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden; /* Biar ga ada scrollbar */
      background-color: #0d1117; /* Warna background gelap biar pas loading ga silau */
    }
    iframe {
      border: none;
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* fallback di atas untuk browser lama; dvh mengikuti toolbar mobile */
      display: block;
    }
  </style>
</head>
<body>

  <iframe id="appFrame" title="ShrimpTrack" src="https://script.google.com/macros/s/AKfycbyImLpKU1dO2a0RAwbVClkDeS2l4AWiuGx2TDswbgu2kxWMC7PXtAolKC3reRw0jR0E/exec"></iframe>

  <!-- JEMBATAN NAVIGASI (wajib ada supaya alamat browser tetap shrimptrack.vercel.app).
       Aplikasi di dalam iframe Apps Script menyapa {st:'hello'}; halaman ini balas {st:'wrap'}
       dan memindahkan iframe-nya sendiri bila aplikasi minta {st:'nav', url}.
       Tanpa skrip ini aplikasi jatuh ke cara lama: tab ikut pindah ke script.google.com.
       Keamanan: pesan {st:'nav'} hanya diterima bila URL-nya berpangkal sama dengan src iframe
       (endpoint /exec yang sama), jadi pihak lain tidak bisa membelokkan iframe ke alamat asing. -->
  <script>
    var fr = document.getElementById('appFrame');
    var EXEC = String(fr.src || '').split('?')[0];
    addEventListener('message', function (e) {
      var d = e.data || {};
      if (d.st === 'hello') {
        try { e.source.postMessage({ st: 'wrap', url: location.href }, '*'); } catch (err) {}
      } else if (d.st === 'nav' && String(d.url || '').indexOf(EXEC) === 0) {
        fr.src = d.url;
      }
    });
  </script>

</body>
</html>
